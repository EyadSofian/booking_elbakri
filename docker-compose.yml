# Local development stack.
# Copy .env.example to .env first; the values below read from it.
services:
  postgres:
    image: postgres:16-alpine
    container_name: elbakri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elbakri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elbakri}
      POSTGRES_DB: ${POSTGRES_DB:-elbakri_operations}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-elbakri} -d ${POSTGRES_DB:-elbakri_operations}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: elbakri-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-elbakri}:${POSTGRES_PASSWORD:-elbakri}@postgres:5432/${POSTGRES_DB:-elbakri_operations}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_ROOT: /app/storage
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Cairo}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@elbakri.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    ports:
      - '4000:4000'
    volumes:
      # Uploaded workbooks and attachments survive a container rebuild.
      - api-storage:/app/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: elbakri-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  api-storage:
